name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Gradle and Loom run on Java 21; the 1.20.1 targets compile to Java 17 bytecode.
      - name: Set up JDK 17 and 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build all six targets and run core tests
        run: ./gradlew build --stacktrace
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}

      - name: Upload built jars
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tickwatch-jars
          path: '*/build/libs/*.jar'
          if-no-files-found: error

      - name: Read mod version
        id: version
        run: |
          VERSION="$(awk -F= '$1 == "mod_version" { print $2 }' gradle.properties)"
          if [ -z "$VERSION" ]; then
            echo "mod_version not found in gradle.properties" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      # Runs on every build so a renamed or missing jar is caught before a release needs it.
      - name: Collect release jars
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bash .github/scripts/collect-jars.sh

      # Everything below only runs for a push to main with a mod_version that has no tag yet.
      - name: Check release tag
        id: release_tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git tag --list "$TAG" | grep -qx "$TAG"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$TAG already exists; skipping publish"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Checked before anything is tagged, so a misconfigured release fails cleanly.
      - name: Verify Modrinth configuration
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.release_tag.outputs.exists == 'false'
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          if [ -z "$MODRINTH_TOKEN" ]; then
            echo "MODRINTH_TOKEN is required to publish a new version" >&2
            exit 1
          fi
          source .github/scripts/targets.sh
          if [ -z "$MODRINTH_PROJECT" ]; then
            echo "MODRINTH_PROJECT is not set in .github/scripts/targets.sh" >&2
            exit 1
          fi
          case "$RELEASE_TYPE" in
            release|beta|alpha) ;;
            *) echo "RELEASE_TYPE in .github/scripts/targets.sh must be release, beta or alpha" >&2; exit 1 ;;
          esac

      - name: Extract release notes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.release_tag.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          awk -v ver="$VERSION" '
            /^## \[/ { if (p) exit; if ($0 ~ ("^## \\[" ver "\\]")) p=1 }
            p { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "Tickwatch $VERSION" > RELEASE_NOTES.md
          fi

      - name: Create release tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.release_tag.outputs.exists == 'false'
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          git config user.name "Fi3w0"
          git config user.email "fi3w0@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Publish GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.release_tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          source .github/scripts/targets.sh
          if [ "$RELEASE_TYPE" = "release" ]; then channel=(--latest); else channel=(--prerelease); fi
          gh release create "$TAG" release/*.jar \
            --title "Tickwatch $VERSION" \
            --notes-file RELEASE_NOTES.md \
            --verify-tag \
            "${channel[@]}"

      - name: Publish Modrinth versions and sync description
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.release_tag.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: bash .github/scripts/publish-modrinth.sh
