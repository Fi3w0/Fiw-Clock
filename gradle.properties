# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# Loom is not yet fully compatible with the configuration cache.
org.gradle.configuration-cache=false

# Mod metadata (the single source of the mod version)
mod_id=fiw-clock
# NeoForge / Forge mod ids may not contain '-'.
forge_mod_id=fiw_clock
archives_base_name=fiw-clock
mod_version=1.1.0
maven_group=com.fiw

# Toolchain
kotlin_version=2.4.0
# Oldest Kotlin stdlib the jars may run on: Fabric Language Kotlin 1.13.4,
# Kotlin for Forge 4.12 (1.20.1), 5.10 (1.21.1) and 6.0 (1.21.11) all ship Kotlin 2.2.
kotlin_api_version=2.2
loom_version=1.16-SNAPSHOT
moddev_version=2.0.141

# Optional integrations (compile-only)
luckperms_api_version=5.4

# Per-target versions (Minecraft, loader, Java) live in each module's gradle.properties.
