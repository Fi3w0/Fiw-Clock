modLoader = "kotlinforforge"
loaderVersion = "${kotlin_for_forge_version_range}"
license = "MIT"
issueTrackerURL = "https://github.com/Fi3w0/Fiw-Clock/issues"

[[mods]]
modId = "${forge_mod_id}"
version = "${version}"
displayName = "Tickwatch"
authors = "fiw"
logoFile = "assets/fiw-clock/icon.png"
# Server-side only: don't flag servers without Tickwatch as incompatible in the server list.
displayTest = "IGNORE_SERVER_VERSION"
description = '''
Lightweight, server-side tracker for player playtime, player/mob kills, deaths, kill streaks, sessions and AFK time, with LuckPerms meta sync, a /tickwatch command and a public API. Saves to a crash-safe JSON file per world.
'''

[[dependencies.${forge_mod_id}]]
modId = "forge"
mandatory = true
versionRange = "${forge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${forge_mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${forge_mod_id}]]
modId = "kotlinforforge"
mandatory = true
versionRange = "${kotlin_for_forge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${forge_mod_id}]]
modId = "luckperms"
mandatory = false
versionRange = "[5,)"
ordering = "NONE"
side = "SERVER"
