modLoader = "kotlinforforge"
loaderVersion = "${kotlin_for_forge_version_range}"
license = "MIT"
issueTrackerURL = "https://github.com/Fi3w0/Fiw-Clock/issues"

[[mods]]
modId = "${forge_mod_id}"
version = "${version}"
displayName = "Tickwatch"
authors = "fiw"
logoFile = "assets/fiw-clock/icon.png"
description = '''
Lightweight, server-side tracker for player playtime, player/mob kills, deaths, kill streaks, sessions and AFK time, with LuckPerms meta sync, a /tickwatch command and a public API. Saves to a crash-safe JSON file per world.
'''

[[dependencies.${forge_mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${forge_mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${forge_mod_id}]]
modId = "kotlinforforge"
type = "required"
versionRange = "${kotlin_for_forge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${forge_mod_id}]]
modId = "luckperms"
type = "optional"
versionRange = "[5,)"
ordering = "NONE"
side = "SERVER"
